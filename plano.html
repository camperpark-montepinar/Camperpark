:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#fff;color:#1f2937;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
h1{font-family:Lora,Georgia,"DejaVu Serif",serif;font-style:italic;font-weight:700;font-size:1.9rem;margin:0}
.logo{width:112px;height:112px;object-fit:contain}
svg{width:100%;height:auto;display:block}
text{font-family:Lora,Georgia,"DejaVu Serif",serif;font-style:italic;fill:#1f2937}
.legend{display:grid;grid-template-columns:repeat(2,max-content);gap:10px 64px;justify-content:start;margin-top:16px;font-size:.88rem}
.legend .li:nth-child(odd){grid-template-columns:104px auto}
.legend .li>i,.legend .li>svg,.legend .sws{justify-self:end}
.legend .sws{display:flex;gap:5px}
.legend .li{display:grid;grid-template-columns:20px auto;align-items:center;gap:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:16px;height:16px;flex:none}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.hr{display:flex;align-items:center;gap:14px}
.lg{display:flex;gap:6px}.lg button{border:1px solid #cbd5e1;background:#fff;border-radius:16px;padding:5px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:#334155}
.lg button.on{background:#0f2e1f;color:#fff;border-color:#0f2e1f}

}
